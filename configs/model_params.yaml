lightgbm:
  objective: regression
  metric: rmse
  verbosity: -1
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 5
  num_leaves: 31
  min_child_samples: 20
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 0.1
  random_state: 42

xgboost:
  objective: reg:squarederror
  n_estimators: 700
  learning_rate: 0.01
  max_depth: 5
  min_child_weight: 3
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 0.1
  random_state: 42
  verbosity: 0

catboost:
  iterations: 500
  learning_rate: 0.05
  depth: 5
  l2_leaf_reg: 3
  random_seed: 42
  verbose: false
  early_stopping_rounds: 50

random_forest:
  n_estimators: 300
  max_depth: 10
  min_samples_split: 5
  min_samples_leaf: 2
  max_features: sqrt
  random_state: 42
  n_jobs: -1

ensemble:
  weights:
    lightgbm: 0.35
    xgboost: 0.35
    catboost: 0.20
    random_forest: 0.10
  method: weighted_average

hyperopt:
  n_trials: 50
  timeout: 3600
  direction: minimize
  metric: rmse
