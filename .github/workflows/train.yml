name: Training Pipeline

on:
  workflow_dispatch:
    inputs:
      model_type:
        description: 'Model to train'
        required: true
        default: 'all'
        type: choice
        options:
          - lightgbm
          - xgboost
          - catboost
          - random_forest
          - ensemble
          - all
      register_model:
        description: 'Register model to MLflow'
        required: true
        default: true
        type: boolean
      n_features:
        description: 'Number of features to select'
        required: false
        default: '150'
        type: string

  schedule:
    # Run weekly on Monday at 2:00 AM UTC
    - cron: '0 2 * * 1'

env:
  PYTHON_VERSION: "3.10"

jobs:
  train:
    name: Train Models
    runs-on: ubuntu-latest

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Kaggle credentials
        run: |
          mkdir -p ~/.kaggle
          echo '{"username":"${{ secrets.KAGGLE_USERNAME }}","key":"${{ secrets.KAGGLE_KEY }}"}' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Download data
        run: |
          python -c "
          from src.data.kaggle_loader import KaggleDataLoader
          loader = KaggleDataLoader()
          loader.download_data()
          print('Data downloaded successfully')
          "

      - name: Run training
        run: |
          python scripts/train.py \
            --model ${{ github.event.inputs.model_type || 'all' }} \
            --n-features ${{ github.event.inputs.n_features || '150' }} \
            ${{ github.event.inputs.register_model == 'true' && '--register' || '' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: training-artifacts
          path: |
            artifacts/models/
            artifacts/logs/
          retention-days: 30

  evaluate:
    name: Evaluate Models
    runs-on: ubuntu-latest
    needs: train

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download training artifacts
        uses: actions/download-artifact@v4
        with:
          name: training-artifacts
          path: artifacts/

      - name: Run evaluation
        run: |
          python scripts/evaluate.py --artifacts-dir artifacts/models

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: artifacts/results/
          retention-days: 30

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [train, evaluate]
    if: always()

    steps:
      - name: Training Summary
        run: |
          echo "Training pipeline completed"
          echo "Model type: ${{ github.event.inputs.model_type || 'all' }}"
          echo "Features: ${{ github.event.inputs.n_features || '150' }}"
          echo "Registered: ${{ github.event.inputs.register_model || 'true' }}"
